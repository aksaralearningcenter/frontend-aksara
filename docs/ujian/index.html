<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M50 15 L30 65 L40 65 L50 40 L60 65 L70 65 Z' fill='%23102B4E'/%3E%3Cpath d='M50 8 L52 14 L58 14 L53 18 L55 24 L50 20 L45 24 L47 18 L42 14 L48 14 Z' fill='%23B8934A'/%3E%3C/svg%3E">
  <!-- Halaman ini sengaja ada di folder /ujian/ supaya alamatnya bersih tanpa
       ".html": /ujian/?id=ASM-xxxx (GitHub Pages melayani index.html folder ini). -->
  <title>Ujian — Aksara Learning Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../src/styles/ujian.css">
</head>
<body>

  <!-- Satu wadah, tiga tampilan: info → mengerjakan → hasil.
       Semua dirender ujian.js supaya tidak ada halaman lain yang bisa dibuka
       siswa selain ujian yang tautannya dibagikan pengajar. -->
  <div class="bungkus">
    <header class="kepala">
      <div class="merek">
        <svg width="30" height="30" viewBox="0 0 100 100" aria-hidden="true">
          <path d="M50 15 L30 65 L40 65 L50 40 L60 65 L70 65 Z" fill="currentColor"/>
          <path d="M50 8 L52 14 L58 14 L53 18 L55 24 L50 20 L45 24 L47 18 L42 14 L48 14 Z" fill="#B8934A"/>
        </svg>
        <div><b>AKSARA</b><small>Learning Center</small></div>
      </div>
      <div id="kotak-waktu" class="kotak-waktu" hidden>
        <span class="label">Sisa waktu</span>
        <b id="waktu-teks">--:--</b>
      </div>
    </header>

    <main id="isi" class="isi">
      <div class="kartu memuat">⏳ Memuat asesmen…</div>
    </main>

    <footer class="kaki">
      <p>Ujian daring Aksara Learning Center · halaman ini hanya memuat satu asesmen yang tautannya Anda terima.</p>
    </footer>
  </div>

  <!-- Panel aksi tetap di bawah: mudah dijangkau ibu jari saat menggulir soal. -->
  <div class="panel-aksi" id="panel-aksi" hidden>
    <span id="kemajuan" class="kemajuan"></span>
    <button class="tombol utama" id="btn-kirim">📤 Kumpulkan Jawaban</button>
  </div>

  <div class="pesan" id="pesan" hidden></div>

  <script type="module" src="../src/js/ujian.js?v=4"></script>
</body>
</html>
